<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aura Farm · Multiplayer</title><style>
*{box-sizing:border-box}body{margin:0;background:#11101c;color:#f8f4ff;font:16px system-ui,sans-serif}main{max-width:650px;margin:auto;padding:22px}h1{color:#f4cb69}h2{font-size:20px}.card{background:#211d31;border:1px solid #48375c;border-radius:16px;padding:20px;margin:16px 0}input,button{font:inherit;border-radius:10px;padding:12px;margin:5px 0;width:100%}input{background:#161324;color:white;border:1px solid #64517a}button{background:#8b59ed;color:white;border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}a{color:#d9baff}small,.muted{color:#c0b5d2}.league{padding:12px;border-top:1px solid #4c3c60}.error{color:#ffb6bc}.ok{color:#aaf0c6}</style></head><body><main><a href="./">← Aura Farm demo</a><h1>⚡ Multiplayer Leagues</h1><p class="muted">Real accounts and invitation-only leagues. Requires one-time Supabase setup.</p><div id="status" role="status"></div><div id="app"></div></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import {SUPABASE_URL,SUPABASE_ANON_KEY} from './supabase-config.js';
const app=document.querySelector('#app'),status=document.querySelector('#status');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!SUPABASE_URL||!SUPABASE_ANON_KEY){app.innerHTML='<div class="card"><h2>Setup needed</h2><p>Configure Supabase URL and publishable key in <code>supabase-config.js</code>, then run <code>supabase-schema.sql</code> in your Supabase project.</p></div>'}
else{
const db=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let user=null;
const notice=(s,err=false)=>{status.className=err?'error':'ok';status.textContent=s};
async function load(){
 const {data:{user:u}}=await db.auth.getUser();user=u;
 if(!user){app.innerHTML='<div class="card"><h2>Sign in / Sign up</h2><form id="auth"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="6" placeholder="Password" required><button name="mode" value="signin">Sign in</button><button name="mode" value="signup">Create account</button></form></div>';app.querySelector('#auth').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),mode=e.submitter.value;const args={email:f.get('email'),password:f.get('password')};const {error}=mode==='signup'?await db.auth.signUp(args):await db.auth.signInWithPassword(args);notice(error?.message|| (mode==='signup'?'Account created. Check your email if confirmation is enabled.':'Signed in.'),!!error);if(!error)await load()};return}
 const {data:profile}=await db.from('profiles').select('display_name').eq('id',user.id).maybeSingle();
 const {data:member,error:memberErr}=await db.from('memberships').select('league_id').eq('user_id',user.id);
 const ids=(member||[]).map(x=>x.league_id);
 const leagues=ids.length?(await db.from('leagues').select('id,name,invite_code').in('id',ids)).data||[]:[];
 app.innerHTML='<div class="card"><h2>Player profile</h2><p>'+esc(user.email)+'</p><form id="profile"><input name="name" maxlength="40" placeholder="Display name" required value="'+esc(profile?.display_name||'')+'"><button>Save profile</button></form><button id="logout">Sign out</button></div><div class="card"><h2>Create a league</h2><form id="create"><input name="name" maxlength="70" placeholder="League name" required><button>Create private league</button></form></div><div class="card"><h2>Join with invite code</h2><form id="join"><input name="code" placeholder="Invitation code" required><button>Join league</button></form></div><div class="card"><h2>Your leagues</h2>'+(memberErr?'<p class="error">'+esc(memberErr.message)+'</p>':leagues.length?leagues.map(l=>'<div class="league"><b>'+esc(l.name)+'</b><p class="muted">Invite code: <strong>'+esc(l.invite_code)+'</strong></p><button data-league="'+esc(l.id)+'">View leaderboard</button><div id="board-'+esc(l.id)+'"></div></div>').join(''):'<p>No leagues yet. Create one or join with a code.</p>')+'</div>';
 app.querySelector('#logout').onclick=async()=>{await db.auth.signOut();notice('Signed out');load()};
 app.querySelector('#profile').onsubmit=async e=>{e.preventDefault();const name=new FormData(e.currentTarget).get('name').trim();const {error}=await db.from('profiles').upsert({id:user.id,display_name:name});notice(error?.message||'Profile saved',!!error);if(!error)load()};
 app.querySelector('#create').onsubmit=async e=>{e.preventDefault();const {data,error}=await db.rpc('create_aura_league',{p_name:new FormData(e.currentTarget).get('name')});notice(error?.message||'League created!',!!error);if(!error)load()};
 app.querySelector('#join').onsubmit=async e=>{e.preventDefault();const {error}=await db.rpc('join_aura_league',{p_code:new FormData(e.currentTarget).get('code')});notice(error?.message||'Joined league!',!!error);if(!error)load()};
 app.querySelectorAll('[data-league]').forEach(b=>b.onclick=async()=>{const id=b.dataset.league,box=document.getElementById('board-'+id);const {data:members,error:me}=await db.from('memberships').select('user_id').eq('league_id',id);const {data:awards,error:ae}=await db.from('aura_awards').select('player_id,points').eq('league_id',id);if(me||ae){box.textContent=me?.message||ae?.message;return}const scores={};(members||[]).forEach(m=>scores[m.user_id]=0);(awards||[]).forEach(a=>scores[a.player_id]=(scores[a.player_id]||0)+a.points);const ranked=Object.entries(scores).sort((a,b)=>b[1]-a[1]);box.innerHTML='<p class="muted">League members: '+(members||[]).length+' · Aura points (server verified only)</p>'+ranked.map(([uid,n],i)=>'<p>#'+(i+1)+' '+(uid===user.id?'You':esc(uid.slice(0,8)))+' — '+n+' aura</p>').join('')+'<small>Member display names and verified voting awards are coming next.</small>'});
}
db.auth.onAuthStateChange(()=>setTimeout(load,0));load();
}
</script></body></html>
